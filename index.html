<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/nicole.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nicole Launcher</title>
  </head>

  <body>
    <div id="app"></div>
    <script>
      // WKWebView 无控制台可用时,把未捕获错误渲染为页面底部红条,便于定位
      ;(function () {
        var box = null
        function showFatal(err) {
          if (!box) {
            box = document.createElement('pre')
            box.style.cssText =
              'position:fixed;left:0;right:0;bottom:0;z-index:9999;margin:0;padding:8px;background:#c25b5b;color:#fff;font-size:12px;line-height:1.5;white-space:pre-wrap;max-height:40vh;overflow:auto'
            document.body.appendChild(box)
          }
          var msg = err && err.stack ? err.name + ': ' + err.message + '\n' + err.stack : String(err)
          box.textContent += (box.textContent ? '\n\n' : '') + msg
          box.scrollTop = box.scrollHeight
        }
        window.addEventListener('error', function (e) {
          showFatal(e.error || e.message)
        })
        window.addEventListener('unhandledrejection', function (e) {
          showFatal(e.reason)
        })
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
