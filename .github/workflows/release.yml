name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            asset-platform: macOS
            asset-arch: aarch64
          # Windows x64
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            asset-platform: Windows
            asset-arch: x64
          # Windows ARM64
          - os: windows-latest
            rust-target: aarch64-pc-windows-msvc
            asset-platform: Windows
            asset-arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build --target ${{ matrix.rust-target }}

      # 统一命名:NicoleLauncher_v<version>_<平台>_<架构>[-setup].exe / .dmg
      - name: Collect and rename bundles
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bd="src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          mkdir -p artifacts
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp "$bd"/dmg/*.dmg "artifacts/NicoleLauncher_v${ver}_${{ matrix.asset-platform }}_${{ matrix.asset-arch }}.dmg"
          else
            cp "$bd"/nsis/*-setup.exe "artifacts/NicoleLauncher_v${ver}_${{ matrix.asset-platform }}_${{ matrix.asset-arch }}-setup.exe"
          fi
          ls -la artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NicoleLauncher_${{ matrix.asset-platform }}_${{ matrix.asset-arch }}
          path: artifacts/*

      # 仅 tag 推送时创建 Draft Release 并附产物(workflow_dispatch 只构建)
      - name: Create draft release with assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: artifacts/*
