[package]
name = "nicole-launcher"
version = "0.1.0"
description = "A Tauri App"
authors = ["CYouth"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nicole_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# unsafe-headers:允许经 IPC 传递 Cookie/Referer 等 fetch 规范禁设头——
# 米哈游 API 鉴权基于 Cookie 头,默认过滤会导致所有需鉴权的接口 -100 未登录
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
# 单实例限制:二次启动聚焦已有窗口(Windows 双击 exe 无系统级去重,防并发写坏数据)
tauri-plugin-single-instance = "2"
# 记住窗口位置与大小(自动持久化,关闭时保存)
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
